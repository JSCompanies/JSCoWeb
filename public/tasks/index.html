const KEY='jai-command-v1';const AREAS=['Just Systems Initiative','JaiSellers Companies','Personal','Relationships & Letters','Faith & Creativity','Home & Life Admin'];let state={tasks:[],areas:AREAS,view:'today',search:'',filter:'all'};let stored;try{stored=JSON.parse(localStorage.getItem(KEY))}catch{}if(stored){state={...state,...stored,view:'today',search:'',filter:'all'}};const $=x=>document.getElementById(x),fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'',today=()=>new Date().toLocaleDateString('en-CA'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,areas:state.areas}));scheduleCloudSave()}catch{alert('Browser storage is full. Export a backup now.')}};function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)};function priorityRank(p){return {P0:0,P1:1,P2:2,P3:3}[p]??2}function sort(t){return [...t].sort((a,b)=>priorityRank(a.priority)-priorityRank(b.priority)|| (a.due||'9999').localeCompare(b.due||'9999'))}function active(){return state.tasks.filter(t=>t.status!=='done')}function overdue(t){return !!t.due&&t.due<today()&&t.status!=='done'}function taskRow(t){return `<div class="task ${t.status==='done'?'done':''}"><input aria-label="Mark complete" type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div class="task-body"><div class="task-title" onclick="editTask('${t.id}')">${esc(t.title)}</div><div class="meta"><span class="pill ${t.priority.toLowerCase()}">${esc(t.priority)}</span><span>${esc(t.area)}</span>${t.project?`<span>· ${esc(t.project)}</span>`:''}${t.due?`<span style="color:${overdue(t)?'var(--alert)':'inherit'}">${overdue(t)?'⚠ ':''}Due ${fmt(t.due)}</span>`:''}${t.status==='waiting'?`<span>◷ Waiting ${esc(t.person||'')}</span>`:''}${t.subtasks?.length?`<span>${t.subtasks.length} steps</span>`:''}</div></div><button class="small" onclick="editTask('${t.id}')">Edit</button></div>`}function renderRows(items,empty='Nothing here yet.') {return items.length?sort(items).map(taskRow).join(''):`<div class="empty">${empty}</div>`}function panel(title,body,hint=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2><span class="hint">${hint}</span></div>${body}</section>`}function render(){const a=active(),n=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});const names={today:["YOUR DAILY BRIEFING","Today's Priorities",n],inbox:['CAPTURE FIRST · SORT LATER','Inbox','Everything starts with a clear next step.'],tasks:['MASTER LIST','All Commitments','Filter, edit, and get the entire picture.'],projects:['MISSION CONTROL','Projects & Areas','Your commitments, organized by purpose.'],waiting:['FOLLOW-THROUGH','Waiting On','People, replies, approvals, and dependencies.'],review:['REFLECT · REALIGN','Weekly Review','Find what slipped, what matters, and what comes next.'],settings:['LOCAL-FIRST','Settings & Backup','Your data, your control.']};let [eye,name,sub]=names[state.view];$('eyebrow').textContent=eye;$('pageTitle').textContent=name;$('subtitle').textContent=sub;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));let html='';if(state.view==='today'){let overdueTasks=a.filter(overdue),due=a.filter(t=>t.due===today()),waiting=a.filter(t=>t.status==='waiting'),next=sort(a.filter(t=>t.status!=='waiting'));html=`<div class="stats"><div class="stat"><b>${a.length}</b><span>Open commitments</span></div><div class="stat danger"><b>${overdueTasks.length}</b><span>Past due</span></div><div class="stat"><b>${due.length}</b><span>Due today</span></div><div class="stat"><b>${waiting.length}</b><span>Awaiting a reply</span></div></div><div class="cols"><div>${panel('Your Top Three',renderRows(next. s="area-card" onclick="showProject('${encodeURIComponent(k)}')"><span><strong>${esc(k.split('|')[1])}</strong><br><span class="mini">${done}/${list.length} completed</span></span><span>→</span></div>`}).join('')||'<p class="muted">No projects in this area yet.</p>')).join('')}if(state.view==='waiting'){html=panel('People & Decisions',renderRows(a.filter(t=>t.status==='waiting'),'Nobody is currently marked as waiting.'))+panel('Upcoming follow-ups',renderRows(a.filter(t=>t.followup&&t.status!=='waiting'),'Add follow-up dates to any task to track them.'))}if(state.view==='review'){let old=a.filter(t=>new Date(t.created).getTime()<Date.now()-14*864e5);html=`<div class="stats"><div class="stat"><b>${state.tasks.filter(t=>t.status==='done').length}</b><span>Completed total</span></div><div class="stat"><b>${a.filter(t=>t.priority==='P0'||t.priority==='P1').length}</b><span>High priority open</span></div><div class="stat"><b>${a.filter(overdue).length}</b><span>Overdue</span></div><div class="stat"><b>${old.length}</b><span>Unfinished 14+ days</span></div></div>`+panel('Unfinished for two weeks or more',renderRows(old,'Nothing stale.'))+panel('Questions worth asking','<p>What can I finish, delegate, defer, or delete? Which commitment affects someone else? What is my next physical action?</p>')}if(state.view==='settings'){html=panel('Your data',`<p>Your task data is saved locally in this browser on this device, not in ChatGPT or an online account. Export backups regularly. Clearing browser storage can erase it.</p><div class="toolbar"><button class="primary" onclick="exportJSON()">Download full backup</button><button onclick="$('importFile').click()">Restore a backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importJSON(this)"><button onclick="exportMarkdown()">Copy ChatGPT briefing</button></div>`)+panel('Private cloud sync',`<div class="note"><strong id="cloudStatus">Cloud: not connected</strong><p>To sync privately across devices, connect a Supabase project. Your browser data stays intact until you choose Upload or Download.</p><label>Project URL<br><input id="cloudUrl" style="width:100%" type="url" placeholder="https://your-project.supabase.co"></label><br><label>Publishable key (never a secret/service_role key)<br><input id="cloudKey" style="width:100%" placeholder="sb_publishable_..."></label><br><label>Email for private sign-in<br><input id="cloudEmail" style="width:100%" type="email" placeholder="you@example.com"></label><div class="toolbar"><button onclick="cloudConnect()">Connect</button><button onclick="cloudSignIn()">Email me login link</button><button onclick="cloudUpload()">Upload my local tasks</button><button onclick="cloudDownload()">Download cloud tasks</button><button onclick="cloudSignOut()">Sign out</button></div><p class="muted">Once signed in, local edits sync automatically after a short delay. On another device, press Download cloud tasks once after signing in. Always export a backup before replacing data.</p></div>` )+panel('Connection status',`<div class="note"><strong>ChatGPT live sync: Not connected.</strong><br>This free offline version has no account, cloud sync, shared database, push notifications, or real-time ChatGPT read/write. Use “Copy ChatGPT briefing” and paste it into our conversation for now. A future online integration requires separate setup.</div>`)+panel('About','<p>JaiSellers Master Task List · An independent personal executive command center.<br><em>Honoring Stories. Building Systems. Driving Change.</em></p>')};$('content').innerHTML=html;if(state.view==='settings')initCloudInputs();if(state.view==='tasks'){$('filter').value=state.filter;$('filter').onchange=e=>{state.filter=e.target.value;render()};$('search').oninput=e=>{state.search=e.target.value;let p=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(p,p)}}};function fill(){ $('area').innerHTML=state.areas.map(x=>`<option>${esc(x)}</option>`).join('');$('projectOptions').innerHTML=[...new Set(state.tasks.map(t=>t.project).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}function newTask(){fill();$('form').reset();$('taskid').value='';$('editorTitle').textContent='New commitment';$('deleteBtn').classList.add('hidden');$('priority').value='P2';$('editor').showModal();$('title').focus()}function editTask(id){const t=state.tasks.find(t=>t.id===id);if(!t)return;fill();for(let k of ['title','notes','area','project','priority','status','due','minutes','person','followup','tags','subtasks'])$(k).value=Array.isArray(t[k])?t[k].join(k==='tags'?', ':'\n'):(t[k]??'');$('taskid').value=t.id;$('editorTitle').textContent='Edit commitment';$('deleteBtn').classList.remove('hidden');$('editor').showModal()}function toggleTask(id,yes){let t=state.tasks.find(t=>t.id===id);if(!t)return;t.status=yes?'done':'open';t.updated=new Date().toISOString();save();render();toast(yes?'Commitment completed ✓':'Reopened')}function showProject(encoded){const k=decodeURIComponent(encoded),[area,project]=k.split('|');state.view='tasks';state.search=project==='Unassigned'?area:project;state.filter='all';render()}$('form').addEventListener('submit',e=>{e.preventDefault();const id=$('taskid').value;const prev=state.tasks.find(t=>t.id===id);let data={id:id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),created:prev?.created||new Date().toISOString(),updated:new Date().toISOString()};for(let k of ['title','notes','area','project','priority','status','due','person','followup'])data[k]=$(k).value.trim();data.minutes=Number($('minutes').value)||0;data.tags=$('tags').value.split(',').map(s=>s.trim()).filter(Boolean);data.subtasks=$('subtasks').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!data.title)return;if(prev)Object.assign(prev,data);else state.tasks.push(data);save();$('editor').close();render();toast('Saved ✓')});$('deleteBtn').onclick=()=>{let id=$('taskid').value;if(confirm('Delete this task permanentl let cloudClient=null, cloudTimer=null, cloudBusy=false;const CLOUDCFG='jaisellers-cloud-config-v1';

async function cloudConnect(){const url=$('cloudUrl').value.trim().replace(/\/$/,'');const key=$('cloudKey').value.trim();const email=$('cloudEmail').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key.startsWith('sb_publishable_')){alert('Enter a valid Supabase project URL and public publishable key. Never paste a secret key.');return}localStorage.setItem(CLOUDCFG,JSON.stringify({url,key,email}));cloudClient=null;setupCloud();showCloudStatus('Configured. Request your email login link.');toast('Cloud configured')}
async function cloudSignIn(){if(!cloudClient&&!setupCloud()){alert('Connect your cloud project first.');return}const email=cloudConfig().email;if(!email){alert('Enter your email address and click Connect first.');return}const {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)alert(error.message);else showCloudStatus('Check your email for a private login link.')}
async function authenticated(){if(!cloudClient&&!setupCloud())throw Error('Cloud not configured');let {data:{user},error}=await cloudClient.auth.getUser();if(error||!user)throw Error('Sign in using the email link first');return user}
async function cloudUpload(silent=false){if(cloudBusy)return;try{cloudBusy=true;let user=await authenticated();let payload={tasks:state.tasks,areas:state.areas,exported:new Date().toISOString()};const {error}=await cloudClient.from('task_snapshots').upsert({user_id:user.id,payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;showCloudStatus('Cloud synced • '+new Date().toLocaleTimeString());if(!silent)toast('Tasks uploaded securely')}catch(e){if(!silent)alert('Cloud upload failed: '+e.message);else showCloudStatus('Cloud sync error: '+e.message)}finally{cloudBusy=false}}
async function cloudDownload(){try{let user=await authenticated();const {data,error}=await cloudClient.from('task_snapshots').select('payload,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data){alert('No cloud backup exists yet. Upload your tasks from the original device first.');return}if(!confirm('Replace tasks on this device with your cloud copy? Download a local backup first if you have newer tasks here.'))return;let incoming=data.payload;if(!Array.isArray(incoming?.tasks))throw Error('Invalid cloud data');state.tasks=incoming.tasks;state.areas=incoming.areas||AREAS;save();render();showCloudStatus('Cloud downloaded • '+new Date().toLocaleTimeString());toast('Cloud tasks restored')}catch(e){alert('Cloud download failed: '+e.message)}}
function scheduleCloudSave(){if(!cloudClient)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudUpload(true),1100)}
async function cloudSignOut(){if(cloudClient)await cloudClient.auth.signOut();showCloudStatus('Signed out. Local tasks remain on this device.');toast('Signed out')}
setupCloud();
render();
</script></body></html>
